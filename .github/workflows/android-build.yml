name: Android CI & Release Build

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:
    inputs:
      version_code:
        description: "Optional Android versionCode integer (defaults to github.run_number)"
        required: false
        type: string
      version_name:
        description: "Optional Android versionName (defaults to 1.0.<run_number>)"
        required: false
        type: string
      publish_release:
        description: "Publish signed Release APK to GitHub Releases (when signing secrets exist)"
        required: false
        default: true
        type: boolean

permissions:
  contents: read

concurrency:
  group: android-build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate-and-test:
    name: Validate and Test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Cache Robolectric Android runtime artifacts
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository/org/robolectric
          key: robolectric-m2-${{ hashFiles('gradle/libs.versions.toml') }}
          restore-keys: |
            robolectric-m2-

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Validate Gradle Wrapper
        run: |
          for required in gradlew gradlew.bat gradle/wrapper/gradle-wrapper.jar gradle/wrapper/gradle-wrapper.properties; do
            if [ ! -f "$required" ]; then
              echo "::error::Missing Gradle wrapper file: $required"
              exit 1
            fi
          done
          chmod +x gradlew
          ./gradlew --version --no-daemon

      - name: Configure and validate google-services.json if provided
        env:
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON_BASE64" ]; then
            echo "$GOOGLE_SERVICES_JSON_BASE64" | tr -d '\r\n ' | base64 -d > app/google-services.json
            ./gradlew :app:validateGoogleServicesConfig --no-daemon
          elif [ -f app/google-services.json ]; then
            ./gradlew :app:validateGoogleServicesConfig --no-daemon
          else
            echo "::notice::app/google-services.json not configured for Validate & Test. Debug compilation and unit tests run with Google Sign-In disabled (no fake client ID injected)."
          fi

      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Compile Kotlin and run unit tests
        run: |
          ./gradlew :app:compileDebugKotlin :app:testDebugUnitTest \
            --no-daemon \
            --stacktrace \
            -Drobolectric.dependency.repo.url=https://maven-central.storage-download.googleapis.com/maven2

      - name: Upload unit test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-reports
          path: |
            app/build/reports/tests/testDebugUnitTest/
            app/build/test-results/testDebugUnitTest/
          if-no-files-found: warn

  build-debug-apk:
    name: Build Debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Restore stable debug keystore
        env:
          DEBUG_KEYSTORE_BASE64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$DEBUG_KEYSTORE_BASE64" ]; then
            echo "$DEBUG_KEYSTORE_BASE64" | tr -d '\r\n ' | base64 -d > debug.keystore
            echo "Restored debug.keystore from DEBUG_KEYSTORE_BASE64 secret."
          elif [ ! -f debug.keystore ] && [ -f debug.keystore.base64 ]; then
            tr -d '\r\n ' < debug.keystore.base64 | base64 -d > debug.keystore
            echo "Restored debug.keystore from repository debug.keystore.base64."
          fi

          if [ ! -f debug.keystore ]; then
            echo "::error::debug.keystore is missing and neither DEBUG_KEYSTORE_BASE64 nor debug.keystore.base64 was found."
            exit 1
          fi

          echo "### Debug Signing Certificate Fingerprints" >> "$GITHUB_STEP_SUMMARY"
          keytool -list -v -keystore debug.keystore -alias androiddebugkey -storepass android -keypass android \
            | grep -E 'SHA1:|SHA256:' >> "$GITHUB_STEP_SUMMARY" || true

      - name: Configure google-services.json if provided
        env:
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON_BASE64" ]; then
            echo "$GOOGLE_SERVICES_JSON_BASE64" | tr -d '\r\n ' | base64 -d > app/google-services.json
          fi

          if [ -f app/google-services.json ]; then
            ./gradlew :app:validateGoogleServicesConfig --no-daemon
            echo "Debug APK includes validated google-services.json." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::warning::app/google-services.json not provided. Building Debug APK cleanly without Firebase/Google Sign-In config; Google Sign-In will report unconfigured in the app until real google-services.json is supplied."
            echo "> **Notice:** Built without \`app/google-services.json\`. Guest mode works; Firebase & Google Sign-In require \`GOOGLE_SERVICES_JSON_BASE64\`." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Build Debug APK
        env:
          INPUT_VERSION_CODE: ${{ inputs.version_code }}
          INPUT_VERSION_NAME: ${{ inputs.version_name }}
        run: |
          chmod +x gradlew
          VER_CODE="${INPUT_VERSION_CODE:-${{ github.run_number }}}"
          VER_NAME="${INPUT_VERSION_NAME:-1.0.${{ github.run_number }}-debug}"
          ./gradlew :app:assembleDebug \
            --no-daemon \
            --stacktrace \
            -PversionCode="$VER_CODE" \
            -PversionName="$VER_NAME"

      - name: Verify Debug APK signature, package ID, and version
        run: |
          APK=$(find app/build/outputs/apk/debug -maxdepth 1 -name '*.apk' | head -n 1)
          if [ -z "$APK" ] || [ ! -f "$APK" ]; then
            echo "::error::No Debug APK produced."
            exit 1
          fi
          mkdir -p dist
          cp "$APK" dist/Mousomi-AI-debug.apk

          BUILD_TOOLS_DIR=$(ls -d "$ANDROID_HOME/build-tools"/* | sort -V | tail -n 1)
          "$BUILD_TOOLS_DIR/apksigner" verify --verbose --print-certs dist/Mousomi-AI-debug.apk
          BADGING=$("$BUILD_TOOLS_DIR/aapt2" dump badging dist/Mousomi-AI-debug.apk)
          echo "$BADGING" | head -n 5
          echo "$BADGING" | grep -q "package: name='com.aistudio.mousomiai.xkmzpq'"

      - name: Upload Debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Mousomi-AI-debug-apk
          path: dist/Mousomi-AI-debug.apk
          if-no-files-found: error

  build-signed-release-apk:
    name: Build Signed Release APK
    needs: [ validate-and-test ]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    outputs:
      release_built: ${{ steps.release_status.outputs.built }}
      version_code: ${{ steps.release_status.outputs.version_code }}
      version_name: ${{ steps.release_status.outputs.version_name }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check Firebase and Release Signing prerequisites
        id: prereqs
        env:
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          MISSING=""
          if [ -z "$GOOGLE_SERVICES_JSON_BASE64" ] && [ ! -f app/google-services.json ]; then
            MISSING="${MISSING} GOOGLE_SERVICES_JSON_BASE64(or app/google-services.json)"
          fi
          if [ -z "$RELEASE_KEYSTORE_BASE64" ]; then
            MISSING="${MISSING} RELEASE_KEYSTORE_BASE64"
          fi
          if [ -z "$STORE_PASSWORD" ]; then
            MISSING="${MISSING} STORE_PASSWORD"
          fi
          if [ -z "$KEY_PASSWORD" ]; then
            MISSING="${MISSING} KEY_PASSWORD"
          fi

          if [ -n "$MISSING" ]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Skipping Signed Release APK build. Missing required configuration:$MISSING"
            {
              echo "### Signed Release APK Skipped"
              echo "The following required secrets/files are not yet configured:$MISSING"
              echo ""
              echo "Debug APK builds remain available. Configure the missing GitHub Actions secrets in **Settings -> Secrets and variables -> Actions** to enable signed Release APKs and GitHub Releases."
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up JDK 17
        if: steps.prereqs.outputs.ready == 'true'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle cache
        if: steps.prereqs.outputs.ready == 'true'
        uses: gradle/actions/setup-gradle@v4

      - name: Restore google-services.json and Release Keystore
        if: steps.prereqs.outputs.ready == 'true'
        env:
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON_BASE64" ]; then
            echo "$GOOGLE_SERVICES_JSON_BASE64" | tr -d '\r\n ' | base64 -d > app/google-services.json
          fi
          echo "$RELEASE_KEYSTORE_BASE64" | tr -d '\r\n ' | base64 -d > release.keystore
          chmod +x gradlew
          ./gradlew :app:validateGoogleServicesConfig --no-daemon

      - name: Accept Android SDK licenses
        if: steps.prereqs.outputs.ready == 'true'
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Build Signed Release APK
        if: steps.prereqs.outputs.ready == 'true'
        id: build_release
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/release.keystore
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          INPUT_VERSION_CODE: ${{ inputs.version_code }}
          INPUT_VERSION_NAME: ${{ inputs.version_name }}
        run: |
          VER_CODE="${INPUT_VERSION_CODE:-${{ github.run_number }}}"
          VER_NAME="${INPUT_VERSION_NAME:-1.0.${{ github.run_number }}}"
          echo "version_code=$VER_CODE" >> "$GITHUB_OUTPUT"
          echo "version_name=$VER_NAME" >> "$GITHUB_OUTPUT"
          ./gradlew :app:assembleRelease \
            --no-daemon \
            --stacktrace \
            -PversionCode="$VER_CODE" \
            -PversionName="$VER_NAME"

      - name: Verify Signed Release APK signature, package ID, version, and Firebase resource
        if: steps.prereqs.outputs.ready == 'true'
        run: |
          APK=$(find app/build/outputs/apk/release -maxdepth 1 -name '*.apk' ! -name '*-unsigned.apk' | head -n 1)
          if [ -z "$APK" ] || [ ! -f "$APK" ]; then
            echo "::error::No signed Release APK produced."
            exit 1
          fi
          mkdir -p dist
          cp "$APK" dist/Mousomi-AI-release.apk

          BUILD_TOOLS_DIR=$(ls -d "$ANDROID_HOME/build-tools"/* | sort -V | tail -n 1)
          "$BUILD_TOOLS_DIR/apksigner" verify --verbose --print-certs dist/Mousomi-AI-release.apk
          BADGING=$("$BUILD_TOOLS_DIR/aapt2" dump badging dist/Mousomi-AI-release.apk)
          echo "$BADGING" | head -n 5
          echo "$BADGING" | grep -q "package: name='com.aistudio.mousomiai.xkmzpq'"

          if ! grep -q 'name="default_web_client_id"' app/build/generated/res/processReleaseGoogleServices/values/values.xml; then
            echo "::error::default_web_client_id was not generated in Release resources."
            exit 1
          fi

      - name: Record Release build output status
        id: release_status
        if: always()
        run: |
          if [ "${{ steps.prereqs.outputs.ready }}" = "true" ] && [ -f dist/Mousomi-AI-release.apk ]; then
            echo "built=true" >> "$GITHUB_OUTPUT"
            echo "version_code=${{ steps.build_release.outputs.version_code }}" >> "$GITHUB_OUTPUT"
            echo "version_name=${{ steps.build_release.outputs.version_name }}" >> "$GITHUB_OUTPUT"
          else
            echo "built=false" >> "$GITHUB_OUTPUT"
            echo "version_code=" >> "$GITHUB_OUTPUT"
            echo "version_name=" >> "$GITHUB_OUTPUT"
          fi

      - name: Clean up temporary keystore
        if: always()
        run: rm -f release.keystore

      - name: Upload Signed Release APK artifact
        if: steps.prereqs.outputs.ready == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: Mousomi-AI-release-apk
          path: dist/Mousomi-AI-release.apk
          if-no-files-found: error

  publish-release:
    name: Publish GitHub Release
    needs: [ build-signed-release-apk ]
    if: >-
      needs.build-signed-release-apk.outputs.release_built == 'true' &&
      (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.publish_release == true))
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Download verified Signed Release APK
        uses: actions/download-artifact@v4
        with:
          name: Mousomi-AI-release-apk
          path: dist

      - name: Verify APK before publishing Release
        run: |
          if [ ! -f dist/Mousomi-AI-release.apk ]; then
            echo "::error::Verified Signed Release APK missing."
            exit 1
          fi
          BUILD_TOOLS_DIR=$(ls -d "$ANDROID_HOME/build-tools"/* | sort -V | tail -n 1)
          "$BUILD_TOOLS_DIR/apksigner" verify --verbose dist/Mousomi-AI-release.apk

      - name: Publish immutable Release and update latest asset safely
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION_CODE: ${{ needs.build-signed-release-apk.outputs.version_code }}
          VERSION_NAME: ${{ needs.build-signed-release-apk.outputs.version_name }}
        run: |
          TAG="v${VERSION_NAME}-b${VERSION_CODE}"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/Mousomi-AI-release.apk --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$TAG" dist/Mousomi-AI-release.apk \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "Mousomi AI v${VERSION_NAME} (build ${VERSION_CODE})" \
              --notes "Verified signed Release APK from commit $GITHUB_SHA"
          fi

          if gh release view latest --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload latest dist/Mousomi-AI-release.apk --clobber --repo "$GITHUB_REPOSITORY"
            gh release edit latest \
              --repo "$GITHUB_REPOSITORY" \
              --title "Mousomi AI Latest Signed Release (v${VERSION_NAME}, build ${VERSION_CODE})" \
              --notes "Latest verified signed Release APK from commit $GITHUB_SHA (tag $TAG)"
          else
            gh release create latest dist/Mousomi-AI-release.apk \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "Mousomi AI Latest Signed Release (v${VERSION_NAME}, build ${VERSION_CODE})" \
              --notes "Latest verified signed Release APK from commit $GITHUB_SHA (tag $TAG)"
          fi
